<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AgentAvatar</title>
<style>
  body { padding: 16px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .stack { display:grid; gap:12px; max-width:420px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px 24px; max-width:460px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var E = window.EquipoVirtual, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div',{className:'row'},['ivan','clara','andrea','olivia','sofia','elena','vera'].map(function(a){return h(E.AgentAvatar,{key:a,agent:a,size:48})})),
h('div',{className:'row',style:{marginTop:16}},h(E.AgentAvatar,{agent:'ivan',size:40,label:true}),h(E.AgentAvatar,{agent:'clara',size:40,label:true}))));
</script>
</body>
</html>
